<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3F51B5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7986CB;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#grad)" />
  
  <!-- Notebook -->
  <rect x="116" y="106" width="240" height="300" rx="20" ry="20" fill="#FFFFFF" />
  
  <!-- Notebook Lines -->
  <line x1="140" y1="166" x2="332" y2="166" stroke="#E0E0E0" stroke-width="4" />
  <line x1="140" y1="206" x2="332" y2="206" stroke="#E0E0E0" stroke-width="4" />
  <line x1="140" y1="246" x2="332" y2="246" stroke="#E0E0E0" stroke-width="4" />
  <line x1="140" y1="286" x2="332" y2="286" stroke="#E0E0E0" stroke-width="4" />
  <line x1="140" y1="326" x2="332" y2="326" stroke="#E0E0E0" stroke-width="4" />
  
  <!-- Notebook Binding -->
  <rect x="116" y="106" width="20" height="300" fill="#3F51B5" />
  
  <!-- Pen -->
  <g transform="rotate(45, 316, 216)">
